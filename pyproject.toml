[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-menu"
version = "1.0.0"
description = "Raspberry Pi menu launcher and Stellar Unicorn applications"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pi-menu = "pi_menu.launcher:main"
pi-menu-doctor = "pi_menu.doctor:main"
pi-menu-flash = "pi_menu.flash:main"
pi-life = "pi_menu.life.app:main"
pi-imgshow = "pi_menu.imgshow.app:main"
pi-platformer = "pi_menu.platformer.app:main"
pi-microcraft = "pi_menu.microcraft.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pi_menu = ["apps.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
